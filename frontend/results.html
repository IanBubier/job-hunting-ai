<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Results • Job Hunting AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>
<body>
  
<!-- Header -->
  <header class="site-header">
    <div class="container header-row">
      <a class="brand" href="{{ url_for('about') }}">
        <img src="{{ url_for('static', filename='assets/images/capstoneLogo.png') }}" alt="Job Hunting AI" height="24" />
        <span>Job Hunting AI</span>
      </a>
      <nav class="nav">
        <a class="nav-link" href="{{ url_for('about') }}">Home</a>
      </nav>
    </div>
  </header>

  <!-- Results -->
  <main>
  <section class="results-section">
    <h1 class="page-title">Search Results</h1>

    <!-- Summary Container -->
    <div class="results-summary">
      <p><strong>Found X matching jobs</strong></p>
      <p class="criteria">(criteria summary here)</p>
    </div>

    <!-- Sorting and Filters -->
    <div class="results-controls">
      <label for="sort" class="label">Sort by:</label>
      <select id="sort" name="sort" class="select">
        <option value="relevance">Relevance</option>
        <option value="recent">Most Recent</option>
        <option value="location">Location</option>
      </select>
    </div>

    <!-- Results Grid -->
    <div class="results-list">
      <!-- Example card -->
      <article class="job-card">
        <h2 class="job-title">Job Title</h2>
        <p class="job-meta"><strong>Company Name</strong> — Location</p>
        <p class="job-description"> Description Here...</p>
        <a href="#" class="btn btn-primary">View Details</a>
      </article>
    </div>
  </section>
</main>

  
  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2025 Ian Bubier, Eduardo Camacho-Lopez, Wei-Yin Chen and Khoi Le</p>
    </div>
  </footer>
</body>
</html>
