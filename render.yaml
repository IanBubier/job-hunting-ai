services:
  - type: web
    name: job-hunting-ai-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -U -r backend/requirements.txt && python backend/download_model.py || true
    startCommand: gunicorn --bind 0.0.0.0:$PORT wsgi:app --workers 2 --log-level info --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
    healthCheckPath: /health
