services:
  - type: web
    name: job-hunting-ai-backend
    env: python
    region: oregon
    plan: free
  buildCommand: pip install -r backend/requirements.txt && python backend/download_model.py
    startCommand: cd backend && gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
    healthCheckPath: /health
